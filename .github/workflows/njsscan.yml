name: njsscan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Tuesday 09:00 UTC — staggered from CodeQL (Mondays) so the
    # security signal lands on different days of the week.
    - cron: '0 9 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  njsscan:
    name: njsscan
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # njsscan ships its own curated Node.js ruleset and uses Semgrep as
      # an embedded semantic-grep engine. Both must be installed — without
      # `semgrep` on PATH the semantic-grep phase crashes (verified locally
      # against the same image setup-python provides).
      - name: Install njsscan and Semgrep CLI
        run: python -m pip install --upgrade pip njsscan semgrep

      - name: Run njsscan
        run: njsscan . --sarif -o njsscan.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1
        with:
          sarif_file: njsscan.sarif
          category: njsscan
